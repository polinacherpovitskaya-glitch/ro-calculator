name: Calculator static deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Deploy GitHub Pages
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: calculator-static-write
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Served by Caddy on the shared server (ro-server/caddy); calc2 is a
  # permanent Caddy redirect to calc.
  RO_CALC_HOST: calc.recycleobject.ru
  RO_STATIC_ROOT: /home/robot/srv/static
  RELEASES_KEPT: 5

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # SHA replaces hand-maintained ?v=N references in the deploy snapshot, so
      # every release gets unique immutable asset URLs.
      - name: Cache-bust asset versions with commit SHA
        run: |
          sha="${GITHUB_SHA::10}"
          find . -name "*.html" -not -path "./node_modules/*" -print0 \
            | xargs -0 sed -i -E "s/\.(js|css)\?v=[0-9]+/.\1?v=${sha}/g"

      - name: Build calculator static bundle
        env:
          OPS_API_URL: https://api.recycleobject.ru
          OPS_BOT_TOKEN: ${{ secrets.OPS_BOT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${OPS_BOT_TOKEN:-}"
          for attempt in 1 2 3; do
            if node scripts/build-yandex-static.mjs; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Static bundle failed after ${attempt} attempts" >&2
              exit 1
            fi
            delay=$((attempt * 15))
            echo "Static bundle attempt ${attempt}/3 failed; retrying in ${delay}s" >&2
            sleep "$delay"
          done

      - name: Configure SSH to the server
        env:
          YANDEX_VM_SSH_PRIVATE_KEY: ${{ secrets.YANDEX_VM_SSH_PRIVATE_KEY }}
          YANDEX_VM_HOST: ${{ secrets.YANDEX_VM_HOST }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$YANDEX_VM_SSH_PRIVATE_KEY" > "$HOME/.ssh/calc_vm"
          chmod 600 "$HOME/.ssh/calc_vm"
          ssh-keyscan -H "$YANDEX_VM_HOST" >> "$HOME/.ssh/known_hosts"

      # Each release lands in its own directory; Caddy serves whatever the
      # calc symlink points at, so the switch is atomic and old releases stay
      # available for a manual rollback (ln -sfn releases/<sha> calc).
      - name: Upload calculator release to the server
        env:
          YANDEX_VM_HOST: ${{ secrets.YANDEX_VM_HOST }}
          YANDEX_VM_USER: ${{ secrets.YANDEX_VM_USER }}
        run: |
          set -euo pipefail
          ssh_cmd="ssh -i $HOME/.ssh/calc_vm -o BatchMode=yes"
          target="$YANDEX_VM_USER@$YANDEX_VM_HOST"
          release="${GITHUB_SHA::10}-${GITHUB_RUN_ID}"
          $ssh_cmd "$target" "install -d -m 755 $RO_STATIC_ROOT/releases"
          rsync -a --delete -e "$ssh_cmd" \
            --link-dest="$RO_STATIC_ROOT/calc/" \
            deploy/static-yandex/ "$target:$RO_STATIC_ROOT/releases/$release/"
          $ssh_cmd "$target" "
            set -e
            cd $RO_STATIC_ROOT
            ln -sfn releases/$release calc.next
            mv -T calc.next calc
            ls -1dt releases/* | tail -n +$((RELEASES_KEPT + 1)) | xargs -r rm -rf
          "

      - name: Verify published calculator version
        env:
          YANDEX_VM_HOST: ${{ secrets.YANDEX_VM_HOST }}
        run: |
          set -euo pipefail
          expected="$(node -e 'console.log(require("./js/version.json").version)')"
          for attempt in 1 2 3 4 5 6; do
            actual="$(
              curl -fsSL --max-time 20 \
                --resolve "${RO_CALC_HOST}:443:${YANDEX_VM_HOST}" \
                "https://${RO_CALC_HOST}/js/version.json?cb=${GITHUB_RUN_ID}-${attempt}" \
                | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{console.log(JSON.parse(d).version||"")}catch{console.log("")}})'
            )" || actual=""
            if [ "$actual" = "$expected" ]; then
              echo "${RO_CALC_HOST}: ${actual}"
              break
            fi
            echo "Waiting for ${RO_CALC_HOST}: got=${actual:-unreachable}, want=${expected}"
            sleep 10
          done
          [ "$actual" = "$expected" ] || exit 1

          # version.json alone is not enough: the page must also run this
          # release's scripts. Check the js/app.js the published page loads.
          page="$(mktemp)"
          curl -fsSL --max-time 20 \
            --resolve "${RO_CALC_HOST}:443:${YANDEX_VM_HOST}" \
            "https://${RO_CALC_HOST}/?cb=${GITHUB_RUN_ID}" -o "$page"
          app_src="$(grep -oE 'src="[^"]*js/app\.js[^"]*"' "$page" | head -1 | sed -E 's/^src="//; s/"$//' || true)"
          case "$app_src" in
            ""|*://*|//*)
              echo "index.html must load js/app.js from this release, got: ${app_src:-nothing}" >&2
              exit 1
              ;;
          esac
          app_js="$(mktemp)"
          curl -fsSL --max-time 20 \
            --resolve "${RO_CALC_HOST}:443:${YANDEX_VM_HOST}" \
            "https://${RO_CALC_HOST}/${app_src#/}" -o "$app_js"
          app_version="$(grep -oE "APP_VERSION = '[^']+'" "$app_js" | head -1 | sed -E "s/.*'([^']+)'/\1/" || true)"
          if [ "$app_version" != "$expected" ]; then
            echo "${RO_CALC_HOST} loads ${app_src} with APP_VERSION ${app_version:-missing}, want ${expected}" >&2
            exit 1
          fi
          echo "${RO_CALC_HOST}: page runs ${app_src} (${app_version})"

      - name: Upload bundle artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calculator-static-bundle
          path: deploy/static-yandex
          if-no-files-found: ignore
