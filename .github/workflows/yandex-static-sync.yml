name: Yandex static mirror sync

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
  workflow_run:
    workflows:
      - Deploy GitHub Pages
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: yandex-static-mirror
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  YC_CLOUD_ID: b1gl59l77vb50ihub2nd
  YC_FOLDER_ID: b1gc32hu5ujioie1o0ht

jobs:
  sync:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        bucket:
          - calc.recycleobject.ru
          - calc2.recycleobject.ru
    env:
      RO_YANDEX_BUCKET: ${{ matrix.bucket }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # SHA вместо ручных
      # ?v=N, чтобы calc2 никогда не отставал от calc из-за браузерного кэша.
      - name: Cache-bust asset versions with commit SHA
        run: |
          sha="${GITHUB_SHA::10}"
          find . -name "*.html" -not -path "./node_modules/*" -print0 \
            | xargs -0 sed -i -E "s/\.(js|css)\?v=[0-9]+/.\1?v=${sha}/g"

      - name: Build Yandex static bundle
        env:
          OPS_API_URL: https://api.recycleobject.ru
          OPS_BOT_TOKEN: ${{ secrets.OPS_BOT_TOKEN }}
          RO_YANDEX_BUCKET: ${{ env.RO_YANDEX_BUCKET }}
        run: |
          set -euo pipefail
          test -n "${OPS_BOT_TOKEN:-}"
          for attempt in 1 2 3; do
            if node scripts/build-yandex-static.mjs; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Static bundle failed after ${attempt} attempts" >&2
              exit 1
            fi
            delay=$((attempt * 15))
            echo "Static bundle attempt ${attempt}/3 failed; retrying in ${delay}s" >&2
            sleep "$delay"
          done

      - name: Install Yandex Cloud CLI
        run: |
          set -euo pipefail
          curl -fsSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$HOME/yandex-cloud" -n
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"

      - name: Upload mirror to Yandex Object Storage
        env:
          YC_OAUTH_TOKEN: ${{ secrets.YC_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${YC_OAUTH_TOKEN:-}" ]; then
            echo "YC_OAUTH_TOKEN secret is required to sync ${RO_YANDEX_BUCKET}" >&2
            exit 1
          fi

          yc config set token "$YC_OAUTH_TOKEN" >/dev/null
          yc config set cloud-id "$YC_CLOUD_ID" >/dev/null
          yc config set folder-id "$YC_FOLDER_ID" >/dev/null

          upload_one() {
            local file="$1"
            local rel="${file#deploy/static-yandex/}"
            local content_type="application/octet-stream"
            local cache_control="public, max-age=31536000, immutable"
            case "$file" in
              *.html)
                content_type="text/html; charset=utf-8"
                cache_control="no-cache, no-store, must-revalidate"
                ;;
              *.css) content_type="text/css; charset=utf-8" ;;
              *.js) content_type="application/javascript; charset=utf-8" ;;
              *.json)
                content_type="application/json; charset=utf-8"
                if [ "$rel" = "js/version.json" ] || [ "$rel" = "data/bootstrap.json" ] || [[ "$rel" == data/bootstrap/* ]] || [ "${rel#floor/}" != "$rel" ]; then
                  cache_control="no-cache, no-store, must-revalidate"
                fi
                ;;
              *.png) content_type="image/png" ;;
              *.jpg|*.jpeg) content_type="image/jpeg" ;;
              *.svg) content_type="image/svg+xml" ;;
              *.ico) content_type="image/x-icon" ;;
              *.webp) content_type="image/webp" ;;
            esac
            yc storage s3 cp "$file" "s3://${RO_YANDEX_BUCKET}/${rel}" --content-type "$content_type" --cache-control "$cache_control"
          }

          while IFS= read -r -d '' file; do
            upload_one "$file"
          done < <(find deploy/static-yandex -type f -print0)

          yc config unset token >/dev/null

      - name: Verify published Yandex version
        run: |
          set -euo pipefail
          expected="$(node -e 'console.log(require("./js/version.json").version)')"
          for attempt in 1 2 3 4 5 6; do
            actual="$(
              curl -fsSL --max-time 20 \
                "https://${RO_YANDEX_BUCKET}/js/version.json?cb=${GITHUB_RUN_ID}-${attempt}" \
                | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{console.log(JSON.parse(d).version||"")}catch{console.log("")}})'
            )" || actual=""
            if [ "$actual" = "$expected" ]; then
              echo "${RO_YANDEX_BUCKET}: ${actual}"
              exit 0
            fi
            echo "Waiting for ${RO_YANDEX_BUCKET}: got=${actual:-unreachable}, want=${expected}"
            sleep 10
          done
          exit 1

      - name: Upload bundle artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yandex-static-${{ matrix.bucket }}
          path: deploy/static-yandex
          if-no-files-found: ignore
