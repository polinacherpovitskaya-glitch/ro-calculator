name: Deploy ops stack

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'ops/**'
      - 'api/telegram-relay.js'
      - 'vercel.json'
      - 'yandex/telegram-relay/**'
      - '.github/workflows/ops-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'ops/**'
      - 'api/telegram-relay.js'
      - 'vercel.json'
      - 'yandex/telegram-relay/**'
      - '.github/workflows/ops-deploy.yml'

concurrency:
  group: ops-deploy
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ops
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ops
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            ops/api/package-lock.json
            ops/bot/package-lock.json
            ops/web/package-lock.json

      - name: Install API deps
        run: |
          cd ops/api
          npm ci

      - name: Apply migrations
        env:
          DATABASE_URL: postgres://ops:ci_password@localhost:5432/ops
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          bash ops/db/migrate.sh

      - name: Run API tests
        env:
          TEST_DATABASE_URL: postgres://ops:ci_password@localhost:5432/ops
        run: |
          cd ops/api
          npm test

      - name: Install Bot deps and test
        env:
          TEST_DATABASE_URL: postgres://ops:ci_password@localhost:5432/ops
        run: |
          cd ops/bot
          npm ci
          npm test

      - name: Test Telegram relay
        run: |
          node --check yandex/telegram-relay/index.js
          node --check api/telegram-relay.js
          node --test yandex/telegram-relay/index.test.js
          node --test tests/vercel-telegram-relay.test.js
          node tests/telegram-runtime-smoke.js
          node tests/timebot-server-migration-smoke.js

      - name: Install Web deps and build
        run: |
          cd ops/web
          npm ci
          npm run build

      - name: Verify production Vercel Telegram relay
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          TELEGRAM_RELAY_SECRET: ${{ secrets.TELEGRAM_RELAY_SECRET }}
          TIMEBOT_TOKEN: ${{ secrets.TIMEBOT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_RELAY_SECRET:-}" ] || [ -z "${TIMEBOT_TOKEN:-}" ]; then
            echo "TELEGRAM_RELAY_SECRET and TIMEBOT_TOKEN secrets are required" >&2
            exit 1
          fi

          TELEGRAM_BASE_API_URL="https://calc.recycleobject.ru/api/telegram-relay/${TELEGRAM_RELAY_SECRET}"
          echo "::add-mask::$TELEGRAM_BASE_API_URL"
          printf '%s' "$TELEGRAM_BASE_API_URL" > "$RUNNER_TEMP/telegram-base-api-url"

          for attempt in $(seq 1 36); do
            if RESPONSE="$(curl --fail --silent --show-error --max-time 20 "${TELEGRAM_BASE_API_URL}/bot${TIMEBOT_TOKEN}/getMe" 2>/dev/null)" \
              && printf '%s' "$RESPONSE" | node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync(0,'utf8')); if(!data.ok||data.result?.username!=='Recycle_object_calc_bot') process.exit(1);"; then
              printf '%s' "$RESPONSE" | node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync(0,'utf8')); console.log('Vercel relay getMe passed for @'+data.result.username);"
              exit 0
            fi
            echo "Vercel relay attempt $attempt/36 is not ready"
            sleep 10
          done
          echo "Vercel Telegram relay did not become ready" >&2
          exit 1

      - name: Set up SSH
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OPS_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.OPS_HOST }} >> ~/.ssh/known_hosts

      - name: Rsync to VPS
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='.env.timebot' \
            ops/ ${{ secrets.OPS_USER }}@${{ secrets.OPS_HOST }}:/srv/ops/

      - name: Install timebot runtime secrets
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          TIMEBOT_TOKEN: ${{ secrets.TIMEBOT_TOKEN }}
        run: |
          set -euo pipefail
          TELEGRAM_BASE_API_URL="$(cat "$RUNNER_TEMP/telegram-base-api-url")"
          umask 077
          {
            printf 'TIMEBOT_TOKEN=%s\n' "$TIMEBOT_TOKEN"
            printf 'TELEGRAM_BASE_API_URL=%s\n' "$TELEGRAM_BASE_API_URL"
            printf 'TELEGRAM_POLL_TIMEOUT_SECONDS=20\n'
            printf 'TELEGRAM_REQUEST_TIMEOUT_MS=45000\n'
          } > "$RUNNER_TEMP/timebot.env"
          scp -i ~/.ssh/deploy_key "$RUNNER_TEMP/timebot.env" ${{ secrets.OPS_USER }}@${{ secrets.OPS_HOST }}:/srv/ops/infra/.env.timebot
          ssh -i ~/.ssh/deploy_key ${{ secrets.OPS_USER }}@${{ secrets.OPS_HOST }} chmod 600 /srv/ops/infra/.env.timebot

      - name: Deploy on VPS
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.OPS_USER }}@${{ secrets.OPS_HOST }} bash <<'REMOTE'
            set -euo pipefail
            cd /srv/ops/infra
            docker compose --env-file .env up -d --build
            for f in /srv/ops/db/migrations/*.sql; do
              docker cp "$f" ops-postgres:/tmp/migration.sql
              docker exec ops-postgres psql -U ops -d ops -v ON_ERROR_STOP=1 -f /tmp/migration.sql
            done
            bash /srv/ops/infra/scripts/ensure-bot-token.sh
            docker compose --env-file .env --env-file .env.timebot --profile timebot up -d --build timebot
          REMOTE

      - name: Health check
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          sleep 15
          for i in 1 2 3 4 5; do
            if curl -sSf "https://ops-staging.recycleobject.ru/api/health" > /dev/null; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
            sleep 5
          done
          echo "Health check failed after retries"
          curl -sS "https://ops-staging.recycleobject.ru/api/health" || true
          exit 1

      - name: Timebot health check
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.OPS_USER }}@${{ secrets.OPS_HOST }} bash <<'REMOTE'
            set -euo pipefail
            for attempt in 1 2 3 4 5; do
              status="$(docker inspect --format '{{.State.Status}}' ops-timebot 2>/dev/null || true)"
              if [ "$status" = "running" ]; then
                break
              fi
              echo "Timebot attempt $attempt: status=${status:-missing}"
              sleep 5
            done
            test "$(docker inspect --format '{{.State.Status}}' ops-timebot)" = "running"
            logs="$(docker logs --tail 120 ops-timebot 2>&1)"
            printf '%s\n' "$logs"
            printf '%s' "$logs" | grep -q 'Polling started at'
            if printf '%s' "$logs" | grep -Eq 'FATAL: Another bot instance|Missing env vars'; then
              echo "Timebot failed its startup checks" >&2
              exit 1
            fi
          REMOTE
