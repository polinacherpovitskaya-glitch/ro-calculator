name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Syntax check JS
        run: |
          set -euo pipefail
          for f in js/*.js corporate-gift/*.js; do
            node --check "$f"
          done
          if [ -f bot/timebot.js ]; then
            node --check bot/timebot.js
          fi
          if [ -f bot/task-notification-core.js ]; then
            node --check bot/task-notification-core.js
          fi
          node tests/version-smoke.js
          node tests/work-management-smoke.js
          node tests/tasks-smoke.js
          if [ -f bot/task-notification-core.js ]; then
            node tests/task-notification-smoke.js
          fi
          node tests/bug-reports-smoke.js
          node tests/order-flow-smoke.js
          node tests/warehouse-migration-smoke.js
          node tests/marketplaces-smoke.js
          node tests/molds-smoke.js
          node tests/molds-price-recovery-smoke.js
          node tests/legacy-host-blocker-smoke.js
          node tests/auth-hardening-smoke.js
          node tests/orders-performance-smoke.js
          node tests/employee-auth-payroll-smoke.js
          node tests/payroll-half-month-smoke.js
          node tests/production-calendar-smoke.js
          node tests/partial-delivery-smoke.js
          node tests/production-load-tooltip-smoke.js
          node tests/calendar-availability-load-smoke.js
          node tests/active-order-recalculation-smoke.js
          node tests/pendant-letter-color-smoke.js
          node tests/recalculate-active-orders-smoke.mjs
          node tests/seasonal-capacity-consensus-smoke.js
          node tests/factual-smoke.js
          node tests/supabase-fallback-smoke.js
          node tests/bootstrap-guard-smoke.js
          node tests/yandex-backup-workflow-smoke.js
          node tests/cloud-consolidation-preservation-smoke.js
          node tests/supabase-preservation-export-smoke.js
          node scripts/cloud-consolidation/verify-preservation-manifest.mjs \
            ops/migration/cloud-consolidation-preservation.json \
            --mode=inventory
          node tests/yandex-api-deploy-smoke.js
          node tests/bootstrap-pagination-smoke.js
          node tests/storage-url-rewrite-smoke.mjs
          node tests/production-floor-publish-smoke.js
          node tests/floor-month-load-smoke.js
          node tests/timebot-state-utils-smoke.js
          node tests/timebot-health-monitor-smoke.js
          node tests/yandex-taskbot-cutover-smoke.js
          node scripts/audit-codebase-health.mjs
          node scripts/audit-data-paths.mjs
          node --check tests/live-site-smoke.mjs
          node --check tests/yandex-mirror-smoke.mjs
          node --check tests/warehouse-stress-smoke.mjs
          node --check .github/scripts/send-telegram-alert.mjs
          node --check .github/scripts/sync-smoke-issue.mjs

  deploy-vercel:
    needs: verify
    runs-on: ubuntu-latest
    # Vercel hosts only the protected Telegram transport relay. Application
    # pages, API and data are deployed to Yandex.
    # Relay deploy must not gate the Yandex static updates.
    # When the token expires the workflow used to fail outright and hide that
    # the static mirrors still shipped a fresh build. Treat the Vercel job as
    # advisory and rely on the post-deploy verification + Telegram alert to
    # surface the real failure to the team.
    continue-on-error: true
    environment:
      name: production
      url: https://ro-calculator-xi.vercel.app/api/telegram-relay/getMe
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    outputs:
      vercel_status: ${{ steps.vercel-deploy.outputs.status }}
      vercel_reason: ${{ steps.vercel-deploy.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Assemble relay-only deployment
        run: |
          set -euo pipefail
          install -d "$RUNNER_TEMP/vercel-relay/api"
          install -d "$RUNNER_TEMP/vercel-relay/yandex/telegram-relay"
          install -m 0644 api/telegram-relay.js "$RUNNER_TEMP/vercel-relay/api/telegram-relay.js"
          install -m 0644 yandex/telegram-relay/index.js "$RUNNER_TEMP/vercel-relay/yandex/telegram-relay/index.js"
          install -m 0644 vercel.json "$RUNNER_TEMP/vercel-relay/vercel.json"

      - name: Deploy Telegram relay
        id: vercel-deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TELEGRAM_RELAY_SECRET: ${{ secrets.TELEGRAM_RELAY_SECRET }}
        run: |
          set +e
          status="success"
          reason=""
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            status="missing_token"
            reason="VERCEL_TOKEN secret is empty"
          elif [ -z "${VERCEL_ORG_ID:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            status="missing_project"
            reason="VERCEL_ORG_ID or VERCEL_PROJECT_ID secret is empty"
          elif [ -z "${TELEGRAM_RELAY_SECRET:-}" ]; then
            status="missing_relay_secret"
            reason="TELEGRAM_RELAY_SECRET secret is empty"
          else
            log_file="$(mktemp)"
            npx vercel@51.6.1 deploy --prod --yes \
              --token "$VERCEL_TOKEN" \
              --env "TELEGRAM_RELAY_SECRET=$TELEGRAM_RELAY_SECRET" \
              --env "TELEGRAM_RELAY_UPSTREAM_TIMEOUT_MS=38000" \
              "$RUNNER_TEMP/vercel-relay" \
              2>&1 | tee "$log_file"
            exit_code=${PIPESTATUS[0]}
            if [ "$exit_code" -ne 0 ]; then
              if grep -qi "token provided via .* is not valid\|token .* is not valid\|please provide a valid token" "$log_file"; then
                status="invalid_token"
                reason="Vercel rejected the token; rotate VERCEL_TOKEN at https://vercel.com/account/tokens and update the GitHub secret"
              else
                status="deploy_failed"
                reason="Vercel CLI exited with code ${exit_code}"
              fi
            fi
            rm -f "$log_file"
          fi
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"
          if [ "$status" != "success" ]; then
            echo ""
            if [ "$status" = "invalid_token" ] || [ "$status" = "missing_token" ]; then
              echo "::warning title=Vercel deploy skipped (${status})::${reason}"
            else
              echo "::error title=Vercel deploy skipped (${status})::${reason}"
            fi
            echo ""
            echo "================================================================"
            echo " Telegram relay did NOT receive this commit."
            echo " Calculator pages remain available on Yandex:"
            echo "   - https://calc.recycleobject.ru/"
            echo "   - https://calc2.recycleobject.ru/"
            echo " To restore the Vercel relay deploy:"
            echo "   1. Generate a new token at https://vercel.com/account/tokens"
            echo "   2. Update the VERCEL_TOKEN secret in GitHub repo settings"
            echo "   3. Re-run this workflow"
            echo "================================================================"
            if [ "$status" = "invalid_token" ] || [ "$status" = "missing_token" ]; then
              exit 0
            fi
            exit 1
          fi

      - name: Notify Telegram on Vercel deploy failure
        if: ${{ failure() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TASK_BOT_TOKEN: ${{ secrets.TASK_BOT_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          TELEGRAM_SMOKE_CHAT_ID: ${{ secrets.TELEGRAM_SMOKE_CHAT_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_WORKFLOW: Telegram relay deploy
          ALERT_SCOPE: Vercel relay-only deploy — ${{ steps.vercel-deploy.outputs.reason || 'unknown failure' }}
          ALERT_STATUS: failure
          ALERT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/send-telegram-alert.mjs
