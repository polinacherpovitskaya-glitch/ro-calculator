name: Calculator data refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: read

concurrency:
  group: calculator-static-write
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RO_CALC_HOST: calc.recycleobject.ru
  RO_STATIC_ROOT: /home/robot/srv/static

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build fresh calculator data
        env:
          OPS_API_URL: https://api.recycleobject.ru
          OPS_BOT_TOKEN: ${{ secrets.OPS_BOT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${OPS_BOT_TOKEN:-}"
          for attempt in 1 2 3; do
            if node scripts/build-yandex-static.mjs; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Data snapshot failed after ${attempt} attempts" >&2
              exit 1
            fi
            delay=$((attempt * 15))
            echo "Data snapshot attempt ${attempt}/3 failed; retrying in ${delay}s" >&2
            sleep "$delay"
          done

      - name: Configure SSH to the server
        env:
          YANDEX_VM_SSH_PRIVATE_KEY: ${{ secrets.YANDEX_VM_SSH_PRIVATE_KEY }}
          YANDEX_VM_HOST: ${{ secrets.YANDEX_VM_HOST }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$YANDEX_VM_SSH_PRIVATE_KEY" > "$HOME/.ssh/calc_vm"
          chmod 600 "$HOME/.ssh/calc_vm"
          ssh-keyscan -H "$YANDEX_VM_HOST" >> "$HOME/.ssh/known_hosts"

      # Only data/ and floor/ of the live release change; rsync writes each
      # file to a temp name and renames it, so hard links shared with older
      # releases are never modified in place.
      - name: Upload data and production floor only
        env:
          YANDEX_VM_HOST: ${{ secrets.YANDEX_VM_HOST }}
          YANDEX_VM_USER: ${{ secrets.YANDEX_VM_USER }}
        run: |
          set -euo pipefail
          ssh_cmd="ssh -i $HOME/.ssh/calc_vm -o BatchMode=yes"
          target="$YANDEX_VM_USER@$YANDEX_VM_HOST"
          live="$($ssh_cmd "$target" "readlink -f $RO_STATIC_ROOT/calc")"
          test -n "$live"
          for dir in data floor; do
            rsync -a -e "$ssh_cmd" "deploy/static-yandex/$dir/" "$target:$live/$dir/"
          done

      - name: Verify refreshed snapshot
        env:
          YANDEX_VM_HOST: ${{ secrets.YANDEX_VM_HOST }}
        run: |
          set -euo pipefail
          expected="$(node -e 'console.log(require("./deploy/static-yandex/data/bootstrap.json").generated_at || "")')"
          for attempt in 1 2 3 4; do
            actual="$(
              curl -fsSL --max-time 20 \
                --resolve "${RO_CALC_HOST}:443:${YANDEX_VM_HOST}" \
                "https://${RO_CALC_HOST}/data/bootstrap.json?cb=${GITHUB_RUN_ID}-${attempt}" \
                | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{console.log(JSON.parse(d).generated_at||"")}catch{console.log("")}})'
            )" || actual=""
            if [ -n "$expected" ] && [ "$actual" = "$expected" ]; then
              echo "Calculator data refreshed at ${actual}"
              exit 0
            fi
            sleep 10
          done
          exit 1
